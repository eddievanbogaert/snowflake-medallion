name: dbt CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'dbt/**'
      - '.github/workflows/dbt-ci.yml'

  # Allow manual trigger for debugging
  workflow_dispatch:

concurrency:
  group: dbt-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DBT_DIR: ./dbt
  PYTHON_VERSION: "3.11"
  DBT_VERSION: "dbt-snowflake==1.8.*"

jobs:

  # ============================================================
  # JOB 1: Lint and compile — fast fail on syntax errors
  # ============================================================
  dbt-compile:
    name: dbt compile (syntax check)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:    ${{ secrets.SNOWFLAKE_CI_USER }}
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      DBT_TARGET: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dbt
        run: pip install "${{ env.DBT_VERSION }}" sqlfluff sqlfluff-templater-dbt

      - name: Write Snowflake private key
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY_CONTENT }}" | base64 -d > /tmp/snowflake_key.p8
          chmod 600 /tmp/snowflake_key.p8

      - name: Write dbt profiles
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          snowflake_medallion:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
                user: "{{ env_var('SNOWFLAKE_USER') }}"
                private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
                private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
                role: TRANSFORMER_ROLE
                warehouse: TRANSFORM_WH
                database: TEST_DB
                schema: "DBT_CI_${{ github.run_id }}"
                threads: 4
                query_tag: "dbt_ci_${{ github.run_id }}"
          EOF

      - name: dbt deps
        working-directory: ${{ env.DBT_DIR }}
        run: dbt deps

      - name: dbt compile
        working-directory: ${{ env.DBT_DIR }}
        run: dbt compile --profiles-dir ~/.dbt

      - name: SQLFluff lint
        working-directory: ${{ env.DBT_DIR }}
        run: |
          sqlfluff lint models/ \
            --dialect snowflake \
            --templater dbt \
            --exclude-rules L016,L034 \
            --ignore parsing
        continue-on-error: true  # Warn on lint failures; don't block merge

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbt-compiled-${{ github.run_id }}
          path: ${{ env.DBT_DIR }}/target/
          retention-days: 7

  # ============================================================
  # JOB 2: Run dbt models against an ephemeral CI schema in TEST_DB
  # ============================================================
  dbt-run-test:
    name: dbt run + test (CI environment)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: dbt-compile

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:    ${{ secrets.SNOWFLAKE_CI_USER }}
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      DBT_TARGET: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dbt
        run: pip install "${{ env.DBT_VERSION }}"

      - name: Write Snowflake private key
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY_CONTENT }}" | base64 -d > /tmp/snowflake_key.p8
          chmod 600 /tmp/snowflake_key.p8

      - name: Write dbt profiles
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          snowflake_medallion:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
                user: "{{ env_var('SNOWFLAKE_USER') }}"
                private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
                private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
                role: TRANSFORMER_ROLE
                warehouse: TRANSFORM_WH
                database: TEST_DB
                schema: "DBT_CI_${{ github.run_id }}"
                threads: 4
                query_tag: "dbt_ci_${{ github.run_id }}"
          EOF

      - name: dbt deps
        working-directory: ${{ env.DBT_DIR }}
        run: dbt deps

      - name: dbt run (modified models only on PR)
        working-directory: ${{ env.DBT_DIR }}
        run: |
          dbt run \
            --profiles-dir ~/.dbt \
            --select state:modified+ \
            --defer \
            --state target/ \
            --full-refresh
        # Falls back to full run if no state available (first run)
        continue-on-error: true

      - name: dbt run (full run fallback)
        if: failure()
        working-directory: ${{ env.DBT_DIR }}
        run: |
          dbt run \
            --profiles-dir ~/.dbt \
            --full-refresh

      - name: dbt test
        working-directory: ${{ env.DBT_DIR }}
        run: |
          dbt test \
            --profiles-dir ~/.dbt \
            --store-failures

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-test-results-${{ github.run_id }}
          path: ${{ env.DBT_DIR }}/target/run_results.json
          retention-days: 30

      - name: Clean up CI schema
        if: always()
        working-directory: ${{ env.DBT_DIR }}
        run: |
          dbt run-operation drop_schema \
            --args "{schema_name: 'DBT_CI_${{ github.run_id }}'}" \
            --profiles-dir ~/.dbt
        continue-on-error: true

  # ============================================================
  # JOB 3: Generate and publish dbt docs (on main branch only)
  # ============================================================
  dbt-docs:
    name: Generate dbt docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: dbt-run-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:    ${{ secrets.SNOWFLAKE_CI_USER }}
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install "${{ env.DBT_VERSION }}"

      - name: Write key + profiles
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY_CONTENT }}" | base64 -d > /tmp/snowflake_key.p8
          mkdir -p ~/.dbt
          # (Profiles written as above — omitted for brevity)

      - name: dbt deps + docs generate
        working-directory: ${{ env.DBT_DIR }}
        run: |
          dbt deps
          dbt docs generate --profiles-dir ~/.dbt

      - name: Deploy docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.DBT_DIR }}/target
          destination_dir: docs/dbt
