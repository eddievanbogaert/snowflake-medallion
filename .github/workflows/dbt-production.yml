name: dbt Production Run

on:
  # Nightly production run — after data arrives from source systems
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC daily

  # Allow manual trigger (e.g. for reruns after pipeline failures)
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Force full refresh (rebuilds all incremental models)
        required: false
        default: 'false'
        type: boolean
      select:
        description: dbt node selection syntax (e.g. tag:silver+ or specific model name)
        required: false
        default: ''

concurrency:
  group: dbt-production
  cancel-in-progress: false  # Never cancel a running production job

env:
  DBT_DIR: ./dbt
  PYTHON_VERSION: "3.11"
  DBT_VERSION: "dbt-snowflake==1.8.*"
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER:    SVC_DBT_TRANSFORMER
  SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
  SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}

jobs:

  dbt-prod-run:
    name: dbt production run
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dbt
        run: pip install "${{ env.DBT_VERSION }}"

      - name: Write Snowflake private key
        run: |
          echo "${{ secrets.SNOWFLAKE_PROD_PRIVATE_KEY }}" | base64 -d > /tmp/snowflake_key.p8
          chmod 600 /tmp/snowflake_key.p8

      - name: Write dbt profiles
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'PROFILES'
          snowflake_medallion:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
                user: "{{ env_var('SNOWFLAKE_USER') }}"
                private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
                private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
                role: TRANSFORMER_ROLE
                warehouse: TRANSFORM_WH
                database: FOUNDATION_DB
                schema: PROD_STAGING
                threads: 16
                query_tag: "dbt_prod_${{ github.run_id }}"
          PROFILES

      - name: dbt deps
        working-directory: ${{ env.DBT_DIR }}
        run: dbt deps

      - name: dbt source freshness check
        working-directory: ${{ env.DBT_DIR }}
        run: |
          dbt source freshness \
            --profiles-dir ~/.dbt \
            --output target/sources.json
        continue-on-error: true  # Alert but don't block run on stale sources

      - name: dbt run — bronze + silver
        working-directory: ${{ env.DBT_DIR }}
        run: |
          FULL_REFRESH_FLAG=""
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            FULL_REFRESH_FLAG="--full-refresh"
          fi

          SELECT_ARG=""
          if [ -n "${{ github.event.inputs.select }}" ]; then
            SELECT_ARG="--select ${{ github.event.inputs.select }}"
          else
            SELECT_ARG="--select tag:bronze tag:silver"
          fi

          dbt run \
            --profiles-dir ~/.dbt \
            $SELECT_ARG \
            $FULL_REFRESH_FLAG

      - name: dbt test — silver (gate before gold)
        working-directory: ${{ env.DBT_DIR }}
        run: |
          dbt test \
            --profiles-dir ~/.dbt \
            --select tag:silver \
            --store-failures

      - name: dbt run — gold (only if silver tests pass)
        working-directory: ${{ env.DBT_DIR }}
        run: |
          FULL_REFRESH_FLAG=""
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            FULL_REFRESH_FLAG="--full-refresh"
          fi

          dbt run \
            --profiles-dir ~/.dbt \
            --select tag:gold \
            $FULL_REFRESH_FLAG

      - name: dbt test — gold
        working-directory: ${{ env.DBT_DIR }}
        run: |
          dbt test \
            --profiles-dir ~/.dbt \
            --select tag:gold \
            --store-failures

      - name: dbt snapshot
        working-directory: ${{ env.DBT_DIR }}
        run: |
          dbt snapshot \
            --profiles-dir ~/.dbt

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-prod-run-${{ github.run_id }}
          path: |
            ${{ env.DBT_DIR }}/target/run_results.json
            ${{ env.DBT_DIR }}/target/manifest.json
          retention-days: 30

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST "$SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            -d '{
              "text": ":red_circle: *dbt Production Run FAILED* on `${{ github.ref_name }}`\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'

      - name: Notify on success
        if: success()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST "$SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            -d '{
              "text": ":white_check_mark: *dbt Production Run SUCCEEDED* — all models refreshed and tests passed."
            }'
