name: 'snowflake_medallion'
version: '1.0.0'
config-version: 2

# Profile defined in ~/.dbt/profiles.yml (not committed to source control)
profile: 'snowflake_medallion'

# Model path configuration
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Persist test results to MONITORING_DB.DATA_QUALITY.DBT_TEST_RESULTS so the
# ALERT_DBT_TEST_FAILURES Snowflake alert can fire (prod target only —
# see macros/data_quality_macros.sql).
on-run-end:
  - "{{ log_test_results(results) }}"

# ============================================================
# Model Configurations
# Snowflake-specific: database, schema, and materialisation
# per layer.  The generate_schema_name macro (in macros/) is
# used to respect custom_schema overrides without prepending
# the target schema name.
# ============================================================

# In prod, each layer lands in its dedicated database. In dev/CI, everything
# builds inside the target's sandbox database (DEV_DB / TEST_DB) so developer
# and CI roles never need DDL privileges on the production databases.
# Schema isolation per developer is handled by macros/generate_schema_name.sql.

models:
  snowflake_medallion:

    # ----------------------------------------------------------
    # BRONZE LAYER
    # Views live in their own BRONZE schema — never in the raw landing
    # schemas — so dbt-managed objects cannot collide with (or require
    # write access to) the loader-managed landing tables.
    # ----------------------------------------------------------
    bronze:
      +database: "{{ 'RAW_DB' if target.name == 'prod' else target.database }}"
      +schema: BRONZE
      +materialized: view            # Bronze models are thin views over raw landing tables
      +tags: ['bronze']
      +meta:
        layer: bronze
        owner: 'data-engineering'
        pii_review_required: false   # Review per-model; bronze is raw/unmasked

      sqlserver:
        +tags: ['bronze', 'sqlserver']

      s3:
        +tags: ['bronze', 's3']

      snowflake_native:
        +tags: ['bronze', 'native']

    # ----------------------------------------------------------
    # SILVER LAYER
    # ----------------------------------------------------------
    silver:
      +database: "{{ 'FOUNDATION_DB' if target.name == 'prod' else target.database }}"
      # Re-attach masking / row access policies after every build — Snowflake
      # drops them when dbt replaces a table (see macros/security_policies.sql)
      +post-hook: "{{ apply_security_policies() }}"
      +materialized: incremental
      +incremental_strategy: merge
      +on_schema_change: fail        # Fail loudly if source schema changes
      +tags: ['silver']
      +meta:
        layer: silver
        owner: 'data-engineering'
        pii_review_required: true

      customers:
        +schema: CUSTOMERS
        +tags: ['silver', 'customers']

      orders:
        +schema: ORDERS
        +tags: ['silver', 'orders']

      products:
        +schema: PRODUCTS
        +tags: ['silver', 'products']

      events:
        +schema: EVENTS
        +tags: ['silver', 'events']
        +materialized: incremental   # Events are high-volume; always incremental

      reference:
        +schema: REFERENCE
        +tags: ['silver', 'reference']
        +materialized: table         # Reference data is small; full refresh is fine

    # ----------------------------------------------------------
    # GOLD LAYER
    # ----------------------------------------------------------
    gold:
      +database: "{{ 'ANALYTICS_DB' if target.name == 'prod' else target.database }}"
      # Re-attach masking / row access policies after every build — Snowflake
      # drops them when dbt replaces a table (see macros/security_policies.sql)
      +post-hook: "{{ apply_security_policies() }}"
      +materialized: table
      +tags: ['gold']
      +meta:
        layer: gold
        owner: 'data-products'
        pii_review_required: true

      marketing:
        +schema: MARKETING
        +tags: ['gold', 'marketing']

      finance:
        +schema: FINANCE
        +tags: ['gold', 'finance']

      operations:
        +schema: OPERATIONS
        +tags: ['gold', 'operations']

      ai:
        +schema: AI
        +tags: ['gold', 'ai']

      executive:
        +schema: EXECUTIVE
        +tags: ['gold', 'executive']

  # ----------------------------------------------------------
  # ELEMENTARY (observability package)
  # Routes Elementary's artefact models to the monitoring database
  # instead of the default target schema.
  # ----------------------------------------------------------
  elementary:
    +database: "{{ 'MONITORING_DB' if target.name == 'prod' else target.database }}"
    +schema: ELEMENTARY

# ============================================================
# Snapshot Configurations
# ============================================================
snapshots:
  snowflake_medallion:
    +target_database: "{{ 'FOUNDATION_DB' if target.name == 'prod' else target.database }}"
    +target_schema: SNAPSHOTS
    +strategy: timestamp
    +updated_at: updated_at
    +tags: ['snapshot']

# ============================================================
# Seed Configurations
# ============================================================
seeds:
  snowflake_medallion:
    +database: "{{ 'FOUNDATION_DB' if target.name == 'prod' else target.database }}"
    +schema: REFERENCE
    +tags: ['seed', 'reference']

# ============================================================
# Data Tests
# Failed rows are stored for investigation. In prod they land in
# MONITORING_DB.DATA_QUALITY (TRANSFORMER_ROLE is granted CREATE TABLE
# there in 03_roles.sql); in dev/CI they stay in the sandbox database.
# ============================================================
data_tests:
  snowflake_medallion:
    +store_failures: true
    +database: "{{ 'MONITORING_DB' if target.name == 'prod' else target.database }}"
    +schema: DATA_QUALITY
    +limit: 500                          # Cap rows stored per test failure

# ============================================================
# Variables
# ============================================================
vars:
  # Lookback window for incremental models (days)
  incremental_lookback_days: 3

  # Used by freshness assertions
  max_load_lag_hours_bronze: 26
  max_load_lag_hours_silver: 4

  # Audit column defaults
  dbt_loaded_by: "dbt"
